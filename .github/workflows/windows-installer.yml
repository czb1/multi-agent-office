name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm dist:win

      - name: Smoke-test silent installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created" }

          $installDir = Join-Path $env:RUNNER_TEMP "multi-agent-office-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          $executable = Join-Path $installDir "Multi-Agent Office.exe"
          if (-not (Test-Path $executable)) {
            throw "Installed executable was not found at $executable"
          }

          $smokeData = Join-Path $env:RUNNER_TEMP "multi-agent-office-user-data"
          $appProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList "--smoke-test", "--user-data-dir=$smokeData" `
            -Wait `
            -PassThru
          if ($appProcess.ExitCode -ne 0) {
            throw "Installed application exited with code $($appProcess.ExitCode)"
          }

          $desktopLog = Join-Path $smokeData "desktop.log"
          if (-not (Test-Path $desktopLog)) {
            throw "Installed application did not create desktop.log"
          }
          if (-not (Select-String -Path $desktopLog -Pattern "Local server ready" -Quiet)) {
            Get-Content $desktopLog
            throw "Installed application did not start its local server"
          }

      - name: Publish checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem "release/*.exe", "release/*.zip" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          if (-not $lines) { throw "No Windows artifacts to checksum" }
          Set-Content -Path "release/SHA256SUMS.txt" -Value $lines -Encoding ascii
          Get-Content "release/SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Windows installer
    if: github.ref_type == 'tag'
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v6
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: release

      - name: Add installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/SHA256SUMS.txt
